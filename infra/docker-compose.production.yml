services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: katrin7828/foodgram_backend:latest
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media

  frontend:
    image: katrin7828/foodgram_frontend:latest
    volumes:
      - frontend_build:/app/result_build

  nginx:
    image: nginx:1.25.4-alpine
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
      - ../docs:/var/www/api-docs:ro
      - backend_static:/var/html/static:ro
      - backend_media:/var/html/media:ro

volumes:
  postgres_data:
  backend_static:
  backend_media:
  frontend_build:
