name: Foodgram CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy Foodgram
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/foodgram/infra
            sudo docker compose -f docker-compose.production.yml pull backend frontend
            sudo docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate backend
            sudo docker compose -f docker-compose.production.yml run --rm backend python manage.py migrate
            sudo docker compose -f docker-compose.production.yml run --rm backend python manage.py collectstatic --noinput
            sudo docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate frontend
            sudo docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate nginx
